<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked by SiteBlock</title>
    <link rel="stylesheet" href="../css/new.css" />
    <link rel="stylesheet" href="../css/inter.css" />
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 90vh; text-align: center; }
      .main { max-width: 560px; padding: 2rem; }
      .emoji { font-size: 3.2rem; }
      #blockedUrl { word-break: break-all; font-family: ui-monospace, monospace; font-size: 0.9em; opacity: 0.8; }
      .btns { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1.2rem; flex-wrap: wrap; }
      #quote { font-style: italic; opacity: 0.75; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="emoji">🧱</div>
      <h1>You blocked this site for a reason.</h1>
      <h2>Get back to work!</h2>
      <p id="blockedUrl"></p>
      <p id="patternLine" style="opacity:.65;font-size:.85em"></p>
      <div class="btns">
        <button id="backBtn">← Go back</button>
        <button id="allowBtn">Allow for 5 min</button>
        <button id="manageBtn">Manage blocklist</button>
      </div>
      <p id="quote"></p>
    </div>
    <script src="../js/matcher.js"></script>
    <script src="../js/blocked.js"></script>
  </body>
</html>
