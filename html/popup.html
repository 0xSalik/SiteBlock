<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SiteBlock</title>
    <link rel="stylesheet" href="../css/new.css" />
    <link rel="stylesheet" href="../css/inter.css" />
    <style>
      body { width: 340px; padding: 1rem 1.1rem 0.6rem; font-size: 15px; }
      .row { display: flex; align-items: center; gap: 0.5rem; }
      .grow { flex: 1; min-width: 0; }
      .muted { opacity: 0.7; font-size: 0.85em; }
      .site { font-weight: 600; word-break: break-all; }
      #currentHost { font-size: 0.95em; }
      .btns { display: flex; gap: 0.4rem; margin: 0.6rem 0; flex-wrap: wrap; }
      button, input[type="button"] { cursor: pointer; }
      #msg { min-height: 1.2em; font-size: 0.85em; }
      .stats { font-size: 0.85em; opacity: 0.8; }
      footer { margin-top: 0.6rem; font-size: 0.8em; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h3 style="margin:0">🧱 SiteBlock</h3>
    <p class="muted" id="currentLine">This page: <span class="site" id="currentHost">…</span></p>
    <p id="stateLine" class="muted"></p>
    <div class="btns">
      <button id="toggleBtn">Block this site</button>
      <button id="optionsBtn" title="Open full settings">Manage</button>
    </div>
    <div class="btns">
      <button data-pause="5" title="Pause blocking for 5 minutes">⏸ 5m</button>
      <button data-pause="30" title="Pause blocking for 30 minutes">⏸ 30m</button>
      <button data-pause="60" title="Pause blocking for 1 hour">⏸ 1h</button>
      <button id="resumeBtn" title="Resume blocking now" hidden>▶ Resume</button>
    </div>
    <p id="msg"></p>
    <p class="stats" id="statsLine"></p>
    <footer><a href="#" id="openOptions">Open full settings →</a></footer>
    <script src="../js/matcher.js"></script>
    <script src="../js/popup.js"></script>
  </body>
</html>
